<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <!-- Terminal Window Background -->
  <rect x="2" y="6" width="60" height="52" rx="10" fill="#0b0e14" stroke="#1e2636" stroke-width="2"/>
  
  <!-- Header Bar -->
  <path d="M 2 16 L 62 16" stroke="#1e2636" stroke-width="1.5"/>
  <rect x="2" y="6" width="60" height="10" rx="10" fill="#161b24"/>
  <rect x="2" y="12" width="60" height="4" fill="#161b24"/>
  
  <!-- Traffic Light Dots -->
  <circle cx="10" cy="11" r="2.5" fill="#ef4444"/>
  <circle cx="17" cy="11" r="2.5" fill="#f59e0b"/>
  <circle cx="24" cy="11" r="2.5" fill="#10b981"/>
  
  <!-- Terminal Prompt Symbol '>' in Emerald Green -->
  <path d="M 12 26 L 22 34 L 12 42" fill="none" stroke="#10b981" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Terminal Cursor '_' in Cyan -->
  <line x1="28" y1="42" x2="44" y2="42" stroke="#06b6d4" stroke-width="4.5" stroke-linecap="round"/>
</svg>
