server {
    listen 80;
    listen [::]:80;
    listen 3000;
    listen [::]:3000;
    listen 8080;
    listen [::]:8080;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # Healthcheck endpoint for PaaS probes
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 'OK';
    }

    # Gzip compression for speed
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1000;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Cache hashed Vite assets for 1 year (immutable)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Cache static documents and images (PDF CV, favicon, SVG)
    location ~* \.(pdf|svg|png|jpg|jpeg|gif|ico|webp|txt)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    # SPA routing fallback: send all non-asset requests to index.html
    location / {
        try_files $uri $uri/ /index.html;
        # Never cache index.html so users always get the freshest deployment
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # Error page fallback
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
